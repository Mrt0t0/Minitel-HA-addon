name: "Minitel-HA"
description: "Controle Home Assistant via Minitel - 3615 MAISON / Control HA from a Minitel"
version: "1.1.1"
slug: "minitel_ha"
url: "https://github.com/Mrt0t0/Minitel-HA"
init: false
arch:
  - aarch64
  - amd64
ports:
  3615/tcp: 3615
  8080/tcp: 8080
ports_description:
  3615/tcp: "WebSocket Minitel (ESP32/TelnetPro/Minimit)"
  8080/tcp: "Interface navigateur / Web browser UI"
map:
  - share:rw
options:
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  splash_seconds: 7
  auto_rotate: 30
  language: "fr"
  weather_entity: "weather.forecast_maison"
schema:
  ha_url: str
  ha_token: password
  splash_seconds: int(0,60)
  auto_rotate: int(0,600)
  language: list(fr|en)
  weather_entity: str?
